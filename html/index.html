<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive_HTML_Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="top-banner">
    <h1>Get an Estimate for Workspace</h1>
  </header>

  <main class="container">
    
    <div class="intro-section">
      <h2>Post Your Requirements</h2>
      <p>Please fill the form below to receive a quote for workspace.<br>Please add all the details required.</p>
    </div>

    <form action="step2.html" method="GET" class="form-card">
      <h3>Contact details</h3>
      <p class="subtitle">Please fill your information so we can get in touch with you</p>
      
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your Name" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="(123)-456-7890" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Your Mail ID" required>
      </div>

      <div class="form-group">
        <label for="date">Date</label>
        <input type="date" id="date" required>
      </div>

      <div class="btn-container">
        <button type="submit" class="btn btn-gradient">Next</button>
      </div>
    </form>

  </main>

</body>
</html>
